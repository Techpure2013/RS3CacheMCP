<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrying Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --slate: #12171b;
  --panel: #1c2329;
  --panel-2: #232c33;
  --line: #2f3a42;
  --bronze: #7a5c33;
  --gold: #e8c77c;
  --text: #ddd6c7;
  --dim: #939a9f;
  --faint: #636c73;
  --hit: #b83a2e;
  --bad: #ff8b7c;
  --good: #8cc47a;
  --shortcut: #b58ce0;
  --order: #a9d6ec;
  --display: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Cascadia Mono", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--slate); color: var(--text); font: 15px/1.4 var(--ui); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
pre { margin: 0; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }

.roster {
  display: flex; align-items: stretch; gap: 8px; padding: 8px 10px;
  background: linear-gradient(#1a2126, #141a1e); border-bottom: 1px solid var(--bronze);
}
.brand { flex: none; display: flex; flex-direction: column; justify-content: center; padding-right: 12px; border-right: 1px solid var(--line); }
.brand h1 { margin: 0; font: 700 26px/1 var(--display); color: var(--gold); white-space: nowrap; }
.brand p { margin: 4px 0 0; font-size: 12.5px; color: var(--dim); max-width: 210px; }
.cards { flex: 1; display: flex; gap: 8px; min-width: 0; overflow-x: auto; }
.adv {
  flex: 1 1 260px; min-width: 220px; max-width: 420px; display: grid; grid-template-columns: 30px minmax(0, 1fr);
  gap: 1px 9px; align-items: start; padding: 6px 10px 7px 6px; text-align: left; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
}
.adv:hover { border-color: var(--bronze); }
.adv[aria-pressed="true"] { border-color: var(--gold); background: var(--panel-2); }
.adv .crest {
  grid-row: span 4; width: 30px; height: 36px; display: grid; place-items: center; margin-top: 2px;
  font: 18px/1 var(--display); color: #fff; text-shadow: 0 1px 0 #000; clip-path: polygon(0 0, 100% 0, 100% 72%, 50% 100%, 0 72%);
}
.adv .name { font-weight: 700; font-size: 14px; line-height: 1.2; }
.adv .now { font-size: 13px; color: var(--text); line-height: 1.25; }
.adv .now .v { font-weight: 700; }
.adv .now .ago { color: var(--dim); }
.adv .ord { font: 13px/1.25 var(--serif); color: var(--order); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.lp { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 2px; }
.lp .bar { flex: 1; height: 5px; background: #0b0f12; border: 1px solid #000; overflow: hidden; }
.lp .bar i { display: block; height: 100%; background: #5fae4a; }
.lp .bar i.warn { background: #d69d3a; }
.lp .bar i.low { background: #cf4c3e; }
.adv.all { flex: 0 0 auto; min-width: 96px; grid-template-columns: 1fr; align-content: center; padding: 6px 14px; }
.adv.all .name { font: 700 19px/1 var(--display); color: var(--gold); }
.adv.all .now { color: var(--dim); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr) 46px 220px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; background: #0d1114; border-right: 1px solid var(--line); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.mapctl { position: absolute; left: 10px; top: 10px; z-index: 6; display: flex; gap: 5px; }
.legend {
  position: absolute; left: 10px; bottom: 10px; z-index: 2; display: grid; gap: 4px; padding: 7px 10px;
  background: #15191ce6; border: 1px solid var(--line); border-radius: 2px; font-size: 12px; color: var(--dim);
}
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.legend svg { width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; }
.legend b { color: var(--gold); font-weight: 500; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; z-index: 3; width: max-content; max-width: 340px; padding: 9px 11px;
  background: #15191cf2; border: 1px solid var(--bronze); border-radius: 2px; box-shadow: 0 4px 16px #0009; font-size: 13px;
}
.tip h3 { margin: 0; font: 700 19px/1.15 var(--display); color: var(--gold); overflow-wrap: anywhere; }
.tip .path { font: 11.5px/1.35 var(--mono); color: var(--dim); overflow-wrap: anywhere; margin: 2px 0 6px; }
.tip p { margin: 0 0 4px; }
.tip .why { font: 13px/1.3 var(--serif); color: var(--order); }
.tip .hint { color: var(--faint); font-size: 12px; margin: 4px 0 0; }
.dark { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 4; max-width: 560px; padding: 10px 14px; background: #2a1512; border: 1px solid var(--hit); border-radius: 2px; color: #f0d6cf; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; color: var(--dim); font: 18px var(--serif); pointer-events: none; }
.routebar { position: absolute; right: 10px; top: 10px; z-index: 2; display: flex; gap: 10px; align-items: center; max-width: min(60%, 560px); padding: 6px 8px 6px 12px; background: #15191cf0; border: 1px solid var(--gold); border-radius: 2px; font-size: 13px; }
.routebar span { font: 14px/1.25 var(--serif); color: var(--order); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.stone { padding: 4px 11px; cursor: pointer; border-radius: 2px; font-size: 13px; white-space: nowrap; background: linear-gradient(#3a434b, #262d33); border: 1px solid #0a0d0f; box-shadow: 0 1px 0 #4d5761 inset; }
.stone:hover { background: linear-gradient(#46505a, #2d353c); }
.stone[aria-pressed="true"] { color: var(--gold); box-shadow: 0 0 0 1px var(--bronze) inset; }

.timeline { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 0 10px; background: var(--panel); border-top: 1px solid var(--bronze); border-right: 1px solid var(--line); }
#tl { width: 100%; height: 34px; display: block; cursor: ew-resize; }
.clock { font: 500 13px/1 var(--mono); color: var(--gold); min-width: 136px; font-variant-numeric: tabular-nums; }
.clock small { display: block; margin-top: 3px; font: 12px/1 var(--ui); color: var(--dim); }
.btns { display: flex; gap: 6px; }

.chat { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: #0f1316; border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
.chattabs { display: flex; gap: 2px; padding: 4px 6px 0; background: var(--panel); border-bottom: 1px solid var(--bronze); align-items: end; }
.chattabs button { padding: 4px 11px 5px; border: 1px solid var(--line); border-bottom: 0; border-radius: 3px 3px 0 0; background: #1a2025; cursor: pointer; font-size: 13px; color: var(--dim); }
.chattabs button[aria-selected="true"] { color: var(--gold); background: #0f1316; border-color: var(--bronze); }
.chattabs .count { margin-left: 5px; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.chattabs .filter { margin-left: auto; align-self: center; font-size: 12px; color: var(--dim); padding: 0 6px 4px; }
.chattabs .filter button { border: 0; background: none; color: var(--gold); padding: 0 0 0 6px; cursor: pointer; }
.lines { overflow-y: auto; padding: 5px 10px 8px; }
.ln { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding: 2px 4px; margin: 0 -4px; font-size: 13.5px; line-height: 1.4; border-radius: 2px; cursor: pointer; }
.ln:hover { background: #1b2126; }
.ln .ts { color: var(--faint); font: 12px var(--mono); margin-right: 6px; }
.ln .who { font-weight: 700; margin-right: 5px; }
.ln .v { font-weight: 700; }
.ln .tg { color: #f1e8d4; }
.ln .x { font: 12.5px var(--mono); color: #a9a293; margin-left: 5px; }
.ln .ok { color: var(--dim); margin-left: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ln .heavy { color: #e59a6a; }
.ln .fail { color: var(--bad); margin-left: 6px; font-weight: 700; }
.ln.order { color: var(--order); font: 14.5px/1.35 var(--serif); padding: 4px; }
.ln.order .who { font: 700 13.5px var(--ui); color: #fff; font-style: normal; }
.ln.cut { color: var(--shortcut); padding-left: 56px; cursor: default; }
.quiet { color: var(--faint); padding: 10px 2px; }

.side { grid-column: 2; grid-row: 1 / span 3; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--panel); }
.sidetabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--bronze); }
.sidetabs button { padding: 10px 0 8px; background: linear-gradient(#232b31, #1a2025); border: 0; border-right: 1px solid #0c0f11; cursor: pointer; font: 700 17px/1 var(--display); color: var(--dim); }
.sidetabs button[aria-selected="true"] { color: var(--gold); background: var(--panel); box-shadow: 0 -2px 0 var(--gold) inset; }
.pane { overflow-y: auto; padding: 12px 12px 24px; }
.pane h2 { margin: 0 0 4px; font: 700 21px/1.15 var(--display); color: var(--gold); text-wrap: balance; overflow-wrap: anywhere; }
.pane .lede { margin: 0 0 12px; font-size: 13px; color: var(--dim); }
.pane .kind { font-size: 13px; font-weight: 700; color: var(--dim); }
.pane .path { font: 12px/1.4 var(--mono); color: var(--dim); overflow-wrap: anywhere; margin: 0 0 10px; }
.h3 { margin: 16px 0 6px; font-size: 13px; font-weight: 700; color: var(--dim); }
.link { background: none; border: 0; padding: 0; color: var(--gold); cursor: pointer; text-align: left; font: inherit; }
.link:hover { text-decoration: underline; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }
.stats div { padding: 6px 7px; background: #151a1e; border: 1px solid #0b0e10; font-size: 11.5px; color: var(--dim); }
.stats b { display: block; font: 700 17px/1.1 var(--ui); color: var(--text); font-variant-numeric: tabular-nums; }
.stats b.bad { color: var(--bad); }

.orders { display: grid; gap: 6px; }
.order { background: #181e22; border: 1px solid var(--line); border-radius: 2px; }
.order.open { border-color: var(--gold); background: #1f262b; }
.order > button { display: grid; gap: 5px; width: 100%; padding: 8px 10px; text-align: left; cursor: pointer; background: none; border: 0; }
.order .top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
.order .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.order .time { font-family: var(--mono); }
.order .txt { font: 15px/1.3 var(--serif); color: var(--order); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.order.open .txt { -webkit-line-clamp: 12; }
.order .sum { font-size: 13px; color: var(--text); }
.strip { display: flex; flex-wrap: wrap; gap: 2px; }
.strip i { width: 7px; height: 10px; border-radius: 1px; }
.strip i.x { box-shadow: 0 0 0 1px var(--bad) inset; }
.steps { border-top: 1px solid var(--line); padding: 6px 6px 8px; display: grid; gap: 1px; }
.step { display: block; width: 100%; text-align: left; padding: 4px 6px; background: none; border: 0; border-radius: 2px; cursor: pointer; font-size: 13.5px; line-height: 1.35; }
.step:hover { background: #262e34; }
.step.fam { padding-left: 22px; }
.step .v { font-weight: 700; }
.step .tg { color: #f1e8d4; overflow-wrap: anywhere; }
.step .x { font: 12px var(--mono); color: #a9a293; overflow-wrap: anywhere; }
.step .n { color: var(--dim); font-size: 12px; }
.step .fail { color: var(--bad); font-weight: 700; }
.step .ok { color: var(--dim); font-size: 12px; }
.step .peek { display: block; font: 12px/1.35 var(--mono); color: var(--bad); overflow-wrap: anywhere; }
.detail { margin: 2px 0 8px 6px; display: grid; gap: 4px; }
.detail pre { font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 300px; overflow: auto; padding: 6px 8px; border-radius: 2px; background: #0e1215; border: 1px solid #262e34; color: #cfc8b8; }
.detail pre.del { background: #2a1614; border-color: #5a2a24; color: #f2c1b9; }
.detail pre.add { background: #16241a; border-color: #2c5236; color: #c6e6c0; }
.detail pre.bad { border-color: #7a2d25; color: #ffb3a8; }
.detail .dl { font-size: 13px; font-weight: 700; color: var(--dim); margin-top: 4px; }

.visits { display: grid; gap: 1px; }
.visit { display: grid; grid-template-columns: 44px 9px minmax(0, 1fr); gap: 6px; align-items: baseline; width: 100%; text-align: left; padding: 4px 6px; background: none; border: 0; border-radius: 2px; cursor: pointer; font-size: 13px; }
.visit:hover { background: #262e34; }
.visit .time { font: 12px var(--mono); color: var(--faint); }
.visit .dot { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
.visit .what { overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { padding: 3px 8px; background: #151a1e; border: 1px solid var(--line); border-radius: 2px; cursor: pointer; font-size: 12.5px; color: var(--text); text-align: left; }
.chip:hover { border-color: var(--bronze); }
.chip small { color: var(--dim); margin-left: 4px; }
.why { display: grid; gap: 3px; }
.why button { font: 14px/1.3 var(--serif); color: var(--order); }

.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.skill { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; align-items: center; gap: 5px; padding: 4px 6px; min-height: 34px; text-align: left; cursor: pointer; background: linear-gradient(#2a3339, #20272c); border: 1px solid #0b0e10; border-radius: 2px; box-shadow: 0 1px 0 #3a444c inset; }
.skill:hover { border-color: var(--bronze); }
.skill .g { font: 15px/1 "Segoe UI Symbol", var(--ui); text-align: center; color: #d9b25a; }
.skill .n { font-size: 11.5px; line-height: 1.1; overflow-wrap: anywhere; }
.skill .lv { font: 700 15px/1 var(--ui); color: var(--gold); font-variant-numeric: tabular-nums; }
.skill.untrained { background: #171c20; box-shadow: none; border-style: dashed; border-color: #343d44; }
.skill.untrained .n, .skill.untrained .g, .skill.untrained .lv { color: var(--faint); }
.skill.hurt .lv { color: var(--bad); }
.setlabel { grid-column: 1 / -1; margin: 8px 0 1px; font-size: 13px; font-weight: 700; color: var(--dim); }
.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 6px; }
.totals div { padding: 7px 8px; background: #151a1e; border: 1px solid #0b0e10; font-size: 12.5px; color: var(--dim); }
.totals b { display: block; font: 700 18px/1.1 var(--ui); color: var(--gold); font-variant-numeric: tabular-nums; }

.seg { display: flex; gap: 4px; margin: 4px 0 10px; }
.big { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.big .num { font: 700 46px/0.9 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.big .cap { font-size: 13px; color: var(--dim); }
.share { grid-column: 1 / -1; height: 9px; display: flex; background: #0b0f12; border: 1px solid #000; }
.share i { display: block; height: 100%; }
.bars { display: grid; grid-template-columns: 110px minmax(0, 1fr) 44px; gap: 3px 8px; align-items: center; font-size: 12.5px; }
.bars .bb { height: 9px; background: #0b0f12; }
.bars .bb i { display: block; height: 100%; }
.bars .c { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.ranked { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.ranked li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 13px; align-items: baseline; }
.ranked .what { overflow-wrap: anywhere; }
.ranked .what code { font: 12px var(--mono); color: #a9a293; }
.ranked .how { color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }

.mapctl .sep { width: 1px; background: var(--line); margin: 2px 4px; }
.mapctl .modebtn[aria-pressed="true"] { background: linear-gradient(#5a4526, #3a2d18); color: #ffe3a0; }
.dotlive { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6fd35a; margin-left: 7px; box-shadow: 0 0 6px #6fd35a; animation: pulse 1s infinite alternate; }
.dotlive.bad { background: #ff6a55; box-shadow: 0 0 6px #ff6a55; }
@keyframes pulse { from { opacity: .45; } to { opacity: 1; } }
@keyframes landed { from { background: #e9ffd8; } }
@keyframes landedbad { from { background: #ffe0d8; } }

/* the sandbox takes the whole stage: the timeline and chat are about the map */
.stage.sandbox-on .timeline, .stage.sandbox-on .chat { display: none; }
.stage.sandbox-on .mapwrap { grid-row: 1 / span 3; }

.sandbox { position: absolute; inset: 0; z-index: 4; display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; padding: 54px 16px 16px; background: #10151a; }
.sb-head { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.sb-head h2 { margin: 0; font: 700 24px/1.1 var(--ui); color: var(--gold); }
.sb-head p { margin: 4px 0 0; font-size: 15px; color: var(--dim); }
.sb-head p b { color: var(--text); font-weight: 700; }
.sb-projects { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; align-items: center; }
.sb-projects .stone { font-size: 14px; padding: 6px 12px; }
.sb-projects .stone small { color: var(--dim); margin-left: 6px; font-size: 13px; }
.sb-head select { background: #151a1e; color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 14px var(--ui); max-width: 380px; }

.sb-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.sb-stats div { padding: 10px 14px; background: #161c21; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; color: var(--dim); }
.sb-stats b { display: block; margin: 2px 0; font: 700 28px/1.15 var(--ui); color: var(--text); font-variant-numeric: tabular-nums; }
.sb-stats b.good { color: #8fd479; }
.sb-stats b.bad { color: var(--bad); }

.sb-body { display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(360px, 32%); gap: 12px; min-height: 0; }
.sb-col { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #141a1f; border: 1px solid var(--line); border-radius: 3px; }
.sb-colhead { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sb-colhead h3 { margin: 0; font: 700 16px/1.25 var(--ui); color: var(--text); }
.sb-scroll { overflow: auto; min-height: 0; }
.sb-empty { padding: 24px 16px; color: var(--dim); font-size: 15px; line-height: 1.5; }

.suite { display: grid; gap: 5px; width: 100%; padding: 10px 14px; text-align: left; cursor: pointer; background: none; border: 0; border-bottom: 1px solid #1f262c; border-left: 3px solid #39434b; }
.suite:hover { background: #1a2126; }
.suite[aria-current="true"] { background: #1f272d; }
.suite.passed { border-left-color: #4f9a45; }
.suite.failed { border-left-color: #d9493a; }
.suite.running { border-left-color: #e8c77c; background: #1f2529; }
.suite .top { display: flex; gap: 8px; align-items: baseline; }
.suite .nm { font-weight: 700; font-size: 15px; color: var(--text); overflow-wrap: anywhere; }
.suite.waiting .nm { color: var(--faint); }
.suite .ct { margin-left: auto; font-size: 13px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.suite .ct .bad { color: var(--bad); font-weight: 700; }
.cells { display: flex; flex-wrap: wrap; gap: 1px; }
.cells i { width: 5px; height: 7px; background: #4f9a45; }
.cells i.x { background: #e0513f; }
.cells i.new { animation: landed .7s ease-out; }
.cells i.x.new { animation: landedbad .7s ease-out; }
@media (prefers-reduced-motion: reduce) { .cells i.new, .ck.new, .dotlive { animation: none; } }

.sb-filter { margin-left: auto; display: flex; gap: 4px; }
.sb-filter button { padding: 3px 10px; font-size: 13px; border-radius: 3px; background: #1a2025; border: 1px solid var(--line); color: var(--dim); cursor: pointer; }
.sb-filter button[aria-pressed="true"] { color: var(--gold); border-color: var(--bronze); }
.agree { width: 100%; font-size: 14px; color: var(--dim); }
.agree b { color: var(--text); }

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const ACT = {
  read:    { verb: "read",           color: "#86b0cf" },
  edit:    { verb: "changed",        color: "#e38b52" },
  write:   { verb: "wrote",          color: "#eaa850" },
  search:  { verb: "searched",       color: "#a8bca9" },
  run:     { verb: "ran",            color: "#c1aee0" },
  ask:     { verb: "asked rs3cache", color: "#e8c35f" },
  fetch:   { verb: "fetched",        color: "#72bcbc" },
  call:    { verb: "called",         color: "#93b5dd" },
  summon:  { verb: "sent a subagent",color: "#cc98d3" },
  askuser: { verb: "asked you", color: "#eba2bb" },
  publish: { verb: "sent",           color: "#b0cb6d" },
  skill:   { verb: "loaded skill",   color: "#cfc090" },
  tool:    { verb: "used",           color: "#a3aaaf" },
};
const BANNERS = ["#c8503f", "#4a82c4", "#58a656", "#b077d4", "#dc9d36", "#3bb0a5", "#d0679a"];
const TINTS = ["#dccb9f", "#c9d0a0", "#dfbb9c", "#b9ceb7", "#d4bdcc", "#e3d19b", "#bec8d6", "#d8b5a8", "#cbc39b", "#b7cac1"]
  .map((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)));
const GENERIC = new Set(["src", "lib", "test", "tests", "engine", "core", "tools", "docs", "scripts", "data", "views", "ui", "dist", "build", "memory", "requirements", "steps", "shared", "types", "config"]);
const FRIENDLY = { shell: "Shell commands", web: "The web", mcp: "Other MCP servers", claude: "Claude Code tools", rs3cache: "rs3cache" };
const KIND = { file: "File", search: "Folder searched", rs3: "rs3cache tool", shell: "Command", web: "Web or other server", claude: "Claude Code tool" };
const CTX_MAX = 1e6, FOG_WINDOW = 45 * 60e3, HOUR = 3600e3;

const S = {
  tools: [], home: "", user: "you", sessions: {}, next: 0, calls: [], byId: new Map(), prompts: [], feed: [], resolved: [], promptsBy: {},
  places: new Map(), newPlaces: 0, colors: {}, order: [], version: 0, loaded: false, skew: 0, offline: false,
  viewT: null, speed: 0, focusSid: null, focusPrompt: null, focusPlace: null,
  side: "orders", chatTab: "all", ledgerRange: HOUR, fog: true, roads: true,
  expanded: new Set(), detail: new Map(), travellers: {}, splats: [], prevT: 0, hover: null,
};

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nowLive = () => Date.now() + S.skew;
const T = () => (S.viewT == null ? nowLive() : S.viewT);
const pad2 = (n) => String(n).padStart(2, "0");
const clock = (t) => { const d = new Date(t); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
const tok = (chars) => Math.round((chars || 0) / 4);
const kfmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1000 ? (n / 1000).toFixed(n >= 1e4 ? 0 : 1) + "k" : String(n);
const ago = (ms) => ms < 60e3 ? Math.max(1, Math.round(ms / 1e3)) + "s" : ms < HOUR ? Math.round(ms / 60e3) + "m" : (ms / HOUR).toFixed(1) + "h";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const byT = (x) => x.t;

function bsearch(arr, t, key) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (key(arr[m]) <= t) lo = m + 1; else hi = m; } return lo; }
function insertSorted(arr, item, key) { arr.splice(bsearch(arr, key(item), key), 0, item); }
function hash(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2; a *= .5; } return s / .9375; }

function rootOf(sid) { const s = S.sessions[sid]; return s && s.parent && S.sessions[s.parent] ? s.parent : sid; }
function nameOf(sid) {
  const s = S.sessions[sid] || {};
  if (s.parent) return "subagent: " + (s.title || s.kind || sid.slice(-6));
  return s.title || s.project || sid.slice(0, 8);
}
function colorOf(sid) {
  const r = rootOf(sid);
  if (!S.colors[r]) { S.colors[r] = BANNERS[S.order.length % BANNERS.length]; S.order.push(r); }
  return S.colors[r];
}

// Places are real names: a path under home, or rs3cache/<set>/<tool>, shell/<program>, web/<host>.
const segs = (key) => key.split("/").filter(Boolean);
function kindOf(key) {
  if (key.endsWith("/(searched)")) return "search";
  return { rs3cache: "rs3", shell: "shell", web: "web", mcp: "web", claude: "claude" }[segs(key)[0]] || "file";
}
function placeName(key) {
  const s = segs(key), k = kindOf(key);
  if (k === "search") return (s[s.length - 2] || "home") + "/";
  if (k === "rs3") return s[s.length - 1];
  if (k === "file") return s[s.length - 1];
  return s.slice(1).join("/") || s[0];
}
function placeShort(key) {
  const s = segs(key), k = kindOf(key);
  if (k === "file") return s.slice(-2).join("/");
  if (k === "search") return s.slice(-3, -1).join("/") + "/";
  return placeName(key);
}
function sentence(c) {
  const k = kindOf(c.place);
  if (c.act === "run" && k === "shell") return { target: c.detail || placeName(c.place), extra: "" };
  if (c.act === "search") return { target: placeShort(c.place), extra: c.detail ? `for ${c.detail}` : "" };
  if (c.act === "ask") return { target: placeName(c.place), extra: c.detail };
  if (k === "file" && (c.act === "run" || c.act === "read") && c.tool !== "Read") return { target: placeShort(c.place), extra: c.detail };
  return { target: placeShort(c.place), extra: c.detail };
}
function outcome(c) {
  if (!c.res) return `<span class="ok">…</span>`;
  const tests = (c.res.tests || []).slice(0, 4).map(([n, p, f]) => `<span class="${f ? "fail" : "ok"}">${esc(n ? n + " " : "")}${p} passed${f ? `, ${f} failed` : ""}</span>`).join("");
  if (c.res.err) return `<span class="fail">failed</span>${tests}`;
  const t = tok(c.res.chars);
  return tests || `<span class="ok ${t >= 5000 ? "heavy" : ""}">${kfmt(t)} tok</span>`;
}

function ingest(got) {
  for (const [id, s] of Object.entries(got.sessions)) S.sessions[id] = s;
  const live = S.loaded && S.viewT == null;
  const kinds = { prompt: [], call: [], result: [] };
  for (const e of got.events) kinds[e.kind]?.push(e);

  for (const e of kinds.prompt) {
    e.calls = [];
    const list = S.promptsBy[e.sid] || (S.promptsBy[e.sid] = []);
    insertSorted(list, e, byT);
    S.prompts.push(e);
    insertSorted(S.feed, e, byT);
  }
  if (kinds.prompt.length) S.prompts.sort((a, b) => a.t - b.t);
  for (const e of kinds.call) {
    const list = S.promptsBy[rootOf(e.sid)] || [];
    e.prompt = list[bsearch(list, e.t, byT) - 1] || null;
    if (e.prompt) insertSorted(e.prompt.calls, e, byT);
    insertSorted(S.calls, e, byT);
    S.byId.set(e.id, e);
    insertSorted(S.feed, e, byT);
    let p = S.places.get(e.place);
    if (!p) { p = { key: e.place, calls: [], acts: {}, fails: 0, chars: 0, edits: 0 }; S.places.set(e.place, p); S.newPlaces++; }
    insertSorted(p.calls, e, byT);
    p.acts[e.act] = (p.acts[e.act] || 0) + 1;
    if (e.act === "edit" || e.act === "write") p.edits++;
    if (live && e.bypass) spawn(e, "skull");
  }
  for (const e of kinds.result) {
    const c = S.byId.get(e.of);
    if (!c || c.res) continue;
    c.res = { t: e.t, err: e.err, chars: e.chars, peek: e.peek, ms: Math.max(0, e.t - c.t) };
    insertSorted(S.resolved, c, (x) => x.res.t);
    const p = S.places.get(c.place);
    if (p) { p.chars += e.chars; if (e.err) p.fails++; }
    if (live) spawn(c, c.res.err ? "err" : tok(c.res.chars) >= 5000 ? "heavy" : "hit");
  }
  S.next = got.next;
  if (got.events.length || !S.loaded) S.version++;
}

async function poll() {
  try {
    const r = await fetch("/events?after=" + S.next, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const got = await r.json();
    S.skew = got.now - Date.now();
    ingest(got);
    if (!S.loaded) { S.loaded = true; S.prevT = T(); }
    if (S.offline) { S.offline = false; $("dark").hidden = true; }
  } catch (err) {
    S.offline = true;
    $("dark").hidden = false;
    $("dark").textContent = "The pool has gone dark: the rs3cache server that served this page has stopped. Start any Claude session with rs3cache and it picks the page back up within twenty seconds.";
  }
  setTimeout(poll, S.offline ? 4000 : 1000);
}

// The world. Folders become kingdoms, their subfolders provinces, and every place a city. Sizes
// come from attention, so where Claude spent its time is where the land is.
const map = $("map"), mctx = map.getContext("2d");
let MW = 0, MH = 0, DPR = 1, W0 = 1600, H0 = 1000;
const V = { zoom: 1, ox: 0, oy: 0 };
const vs = () => (MW / W0) * V.zoom;
const sx = (wx) => wx * vs() + V.ox, sy = (wy) => wy * vs() + V.oy;
const world = { list: [], cities: new Map(), kingdoms: [], provinces: [], grid: [], G: 70, gw: 0, gh: 0, builtAt: 0 };
const base = { canvas: null, names: null, s: 1, ox: 0, oy: 0, boxes: [] };

function node(name) { return { name, label: name, path: name, kids: new Map(), place: null, w: 0 }; }
function weigh(n) {
  let w = n.place ? 1 + Math.round(Math.log2(1 + n.place.calls.length) * 1.5) : 0;
  for (const k of n.kids.values()) w += weigh(k);
  return (n.w = w);
}
function collapse(n) {
  while (!n.place && n.kids.size === 1) {
    const only = n.kids.values().next().value;
    if (!only.kids.size) break;
    const m = node(n.name + "/" + only.name);
    m.path = only.path; m.kids = only.kids; m.w = only.w; m.place = only.place;
    n = m;
  }
  return n;
}
function labelOf(n, parent) {
  const path = n.path;
  if (/\.claude\/projects\/[^/]+\/memory$/.test(path)) return "Claude's memory";
  if (/AppData\/Local\/Temp\/claude/.test(path)) return "Claude's scratchpads";
  if (/AppData\/Local\/Temp$/.test(path)) return "Temp files";
  if (/^\/?tmp$/.test(path)) return "/tmp";
  if (/\.claude\/projects/.test(path)) return "Claude transcripts";
  if (FRIENDLY[path]) return FRIENDLY[path];
  const parts = n.name.split("/");
  let label = parts.slice(-2).join("/");
  if (parts.length === 1 && GENERIC.has(parts[0]) && parent && parent.name) label = parent.name.split("/").pop() + "/" + parts[0];
  if (/^rs3cache\//.test(path)) label = "rs3cache: " + parts[parts.length - 1];
  return label;
}
function splitNode(n) {
  const out = [], loose = node("");
  for (const raw of n.kids.values()) {
    const c = collapse(raw);
    if (!c.kids.size) { loose.kids.set(c.name, c); loose.w += c.w; continue; }
    c.label = labelOf(c, n);
    out.push(c);
  }
  if (loose.kids.size) {
    loose.path = n.path + "/*";
    loose.label = n.path ? labelOf(n, null) + " (loose files)" : "Loose files";
    out.push(loose);
  }
  return out;
}

function squarify(items, rect) {
  const total = items.reduce((a, it) => a + it.w, 0);

  if (tab === "changes") return e.kind === "call" && (e.act === "edit" || e.act === "write");
  if (tab === "errors") return e.kind === "call" && e.res?.err;

function lineHTML(e) {
  const ts = `<span class="ts">${clock(e.t)}</span>`;

let chatKey = "";

function stepHTML(c, label, n) {

function summary(calls) {
  const files = new Set(), changed = new Set();
  let runs = 0, runFails = 0, asks = 0, fails = 0, chars = 0;
  for (const c of calls) {
    const k = kindOf(c.place);
    if (k === "file") files.add(c.place);
    if (c.act === "edit" || c.act === "write") changed.add(c.place);
    if (c.act === "run") { runs++; if (c.res?.err) runFails++; }
    if (c.act === "ask") asks++;
    if (c.res?.err) fails++;
    chars += c.res?.chars || 0;
  }
  const bits = [];
  if (files.size) bits.push(`Touched ${files.size} file${files.size > 1 ? "s" : ""}${changed.size ? `, changed ${changed.size}` : ""}.`);
  if (runs) bits.push(`Ran ${runs} command${runs > 1 ? "s" : ""}${runFails ? `, <b style="color:var(--bad)">${runFails} failed</b>` : ""}.`);
  if (asks) bits.push(`Asked rs3cache ${asks} time${asks > 1 ? "s" : ""}.`);
  if (fails - runFails > 0) bits.push(`<b style="color:var(--bad)">${fails - runFails}</b> other call${fails - runFails > 1 ? "s" : ""} failed.`);
  bits.push(`${kfmt(tok(chars))} tokens came back.`);
  return bits.join(" ");
}
function renderOrders(t) {
  const list = S.prompts.filter((p) => p.t <= t && (!S.focusSid || p.sid === S.focusSid)).slice(-60).reverse();
  if (!list.length) return `<h2>Orders</h2><p class="lede">No orders in the last day.</p>`;
  const cards = list.map((p) => {
    const calls = p.calls.filter((c) => c.t <= t), open = S.focusPrompt === p;
    const end = calls.length ? calls[calls.length - 1].t : p.t;
    const strip = calls.slice(0, 90).map((c) => `<i class="${c.res?.err ? "x" : ""}" style="background:${(ACT[c.act] || ACT.tool).color}"></i>`).join("");
    let steps = "";
    if (open) {
      const groups = [];
      for (const c of calls) {
        const g = groups[groups.length - 1];
        if (g && g.c.act === c.act && g.c.place === c.place && g.c.sid === c.sid) { g.n++; if (c.res?.err) g.c = c; continue; }
        groups.push({ c, n: 1 });

    }

      <span class="top"><span class="dot" style="background:${colorOf(p.sid)}"></span><span class="time">${clock(p.t)}</span><span>${esc(nameOf(p.sid))}</span><span style="margin-left:auto">${calls.length ? `${calls.length} steps · ${ago(end - p.t)}` : "no steps"}</span></span>

  return `<h2>Orders</h2><p class="lede">Everything ${esc(S.user)} asked for, and what Claude did about it. Open one to walk its steps and draw its route on the map. Any step opens to the real change, command or answer.</p><div class="orders">${cards}</div>`;
}

function renderPlace(t) {
  if (!S.focusPlace || !S.places.has(S.focusPlace)) {
    const top = [...S.places.values()].map((p) => ({ p, n: bsearch(p.calls, t, byT) })).filter((x) => x.n).sort((a, b) => b.n - a.n).slice(0, 16);
    return `<h2>Place</h2><p class="lede">Click anything on the map to see every visit to it, why Claude went there, and what it worked on alongside. The busiest places today:</p>
      <div class="chips">${top.map(({ p, n }) => `<button class="chip" data-place="${esc(p.key)}">${esc(placeShort(p.key))}<small>${n}</small></button>`).join("")}</div>`;
  }
  const p = S.places.get(S.focusPlace), upto = bsearch(p.calls, t, byT), calls = p.calls.slice(0, upto);
  const count = (a) => calls.filter((c) => c.act === a).length;
  const fails = calls.filter((c) => c.res?.err).length, chars = calls.reduce((a, c) => a + (c.res?.chars || 0), 0);
  const who = new Set(calls.map((c) => rootOf(c.sid)));
  const stat = (label, n, bad) => `<div><b class="${bad && n ? "bad" : ""}">${kfmt(n)}</b>${label}</div>`;
  const orders = [...new Set(calls.map((c) => c.prompt).filter(Boolean))].slice(-6).reverse();
  const near = new Map();
  for (const r of roads) { if (r.a === p.key) near.set(r.b, r.n); if (r.b === p.key) near.set(r.a, r.n); }
  const nearby = [...near.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8);
  const visits = calls.slice(-80).reverse().map((c) => {
    const verb = ACT[c.act] || ACT.tool, open = S.expanded.has(c.id), { extra } = sentence(c);

    <p class="h3">Why Claude came here</p><div class="why">${orders.map((o) => `<button class="link" data-prompt="${o.seq}">“${esc(o.text.replace(/\s+/g, " ").slice(0, 150))}”</button>`).join("") || `<span class="quiet">Before any order in the loaded day.</span>`}</div>
    ${nearby.length ? `<p class="h3">Worked on alongside</p><div class="chips">${nearby.map(([k, n]) => `<button class="chip" data-place="${esc(k)}">${esc(placeShort(k))}<small>${n}</small></button>`).join("")}</div>` : ""}
    <p class="h3">Every visit, newest first${who.size > 1 ? `, by ${who.size} Claudes` : ""}</p><div class="visits">${visits}</div>`;

const XP = [0];
(() => { let pts = 0; for (let l = 1; l < 120; l++) { pts += Math.floor(l + 300 * Math.pow(2, l / 7)); XP[l] = Math.floor(pts / 4); } })();
const levelOf = (xp) => { let l = 1; while (l < 99 && XP[l] <= xp) l++; return l; };
const SET_ORDER = ["cache", "game", "scripts", "docs", "meta"];
const SET_NAME = { cache: "Cache", game: "Game state", scripts: "Clientscripts", docs: "Docs", meta: "Meta" };
const SET_GLYPH = { cache: "⛏", docs: "¶", scripts: "⚰", game: "◉", meta: "♜" };
// a set an add-on brings sorts after these, under its own name
const setRank = (s) => { const i = SET_ORDER.indexOf(s); return i < 0 ? SET_ORDER.length : i; };
function renderSkills(t) {
  let total = 0, untrained = 0, calls = 0, set = "", html = "";
  const tools = [...S.tools].sort((a, b) => setRank(a.set) - setRank(b.set) || a.set.localeCompare(b.set) || a.name.localeCompare(b.name));
  for (const tool of tools) {
    if (tool.set !== set) { set = tool.set; html += `<div class="setlabel">${esc(SET_NAME[set] || set[0].toUpperCase() + set.slice(1))}</div>`; }
    const key = `rs3cache/${tool.set}/${tool.name}`, p = S.places.get(key);
    const mine = p ? p.calls.filter((c) => c.t <= t && (!S.focusSid || rootOf(c.sid) === S.focusSid)) : [];
    const n = mine.length, err = mine.filter((c) => c.res?.err).length;
    const lv = n ? levelOf((n - err) * 2500 + err * 250) : 1;
    total += lv; calls += n;
    if (!n) untrained++;
    const title = n ? `${tool.name}: ${n} calls, ${err} failed. Last: ${mine[n - 1].detail}` : `${tool.name}: not called in the last day`;
    html += `<button class="skill ${n ? "" : "untrained"} ${n && err * 3 >= n ? "hurt" : ""}" data-place="${esc(key)}" title="${esc(title)}">
      <span class="g">${SET_GLYPH[tool.set] || "✦"}︎</span><span class="n">${esc(tool.name.replace(/^rs3_/, ""))}</span><span class="lv">${lv}</span></button>`;
  }
  return `<h2>Skills</h2><p class="lede">One skill per rs3cache tool, levelled on the RS3 xp curve by calls in the last day. Dashed means nobody used it, and a tool nobody uses is a tool nobody debugs. Click one for its calls and answers.</p>
    <div class="skills">${html}</div>
    <div class="totals"><div><b>${total}</b>total level</div><div><b>${untrained} of ${S.tools.length}</b>never used today</div><div><b>${kfmt(calls)}</b>questions asked</div><div><b>${S.tools.length ? Math.round(((S.tools.length - untrained) / S.tools.length) * 100) : 0}%</b>of tools used</div></div>`;
}

function renderLedger(t) {
  const since = t - S.ledgerRange;
  const calls = S.calls.filter((c) => c.t <= t && c.t >= since && (!S.focusSid || rootOf(c.sid) === S.focusSid));
  const asks = calls.filter((c) => c.act === "ask").length;
  const pct = calls.length ? Math.round((asks / calls.length) * 100) : 0;
  const acts = {};
  calls.forEach((c) => (acts[c.act] = (acts[c.act] || 0) + 1));
  const actRows = Object.entries(acts).sort((a, b) => b[1] - a[1]), actTop = actRows.length ? actRows[0][1] : 1;
  const visits = {};
  calls.forEach((c) => (visits[c.place] = (visits[c.place] || 0) + 1));
  const busiest = Object.entries(visits).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const again = new Map();
  calls.forEach((c) => { if (c.act === "read" && c.prompt) { const k = c.prompt.seq + "\n" + c.place; again.set(k, (again.get(k) || 0) + 1); } });

  const heavy = calls.filter((c) => c.res && !c.res.err).sort((a, b) => b.res.chars - a.res.chars).slice(0, 6);
  const failed = {};
  calls.filter((c) => c.res?.err).forEach((c) => (failed[c.place] = (failed[c.place] || 0) + 1));
  const failRows = Object.entries(failed).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const cuts = calls.filter((c) => c.bypass);
  const seg = (ms, label) => `<button class="stone" data-range="${ms}" aria-pressed="${S.ledgerRange === ms}">${label}</button>`;
  const placeItem = (k, how) => `<li><span class="what"><button class="link" data-place="${esc(k)}">${esc(placeShort(k))}</button></span><span class="how">${how}</span></li>`;
  const none = (text) => `<li><span class="what" style="color:var(--dim)">${text}</span></li>`;
  return `<h2>Ledger</h2><div class="seg">${seg(HOUR, "Last hour")}${seg(6 * HOUR, "Six hours")}${seg(24 * HOUR, "The day")}</div>
    <div class="big"><span class="num">${pct}%</span><span class="cap">of ${kfmt(calls.length)} calls asked rs3cache. The rest went to the shell, files and other tools.</span>
      <span class="share"><i style="width:${pct}%;background:#c9a227"></i><i style="width:${100 - pct}%;background:#56616a"></i></span></div>
    <p class="h3">What the calls did</p>
    <div class="bars">${actRows.map(([a, n]) => `<span style="color:${ACT[a]?.color}">${esc(ACT[a]?.verb || a)}</span><span class="bb"><i style="width:${((n / actTop) * 100).toFixed(1)}%;background:${ACT[a]?.color}"></i></span><span class="c">${kfmt(n)}</span>`).join("")}</div>
    <p class="h3">Busiest places</p><ul class="ranked">${busiest.map(([k, n]) => placeItem(k, n)).join("") || none("Nothing yet")}</ul>
    <p class="h3">Read over and over in one order</p><ul class="ranked">${rereads.map(([k, n]) => placeItem(k.split("\n")[1], `${n} times`)).join("") || none("No file was read three times for the same order.")}</ul>
    <p class="h3">Heaviest answers</p><ul class="ranked">${heavy.map((c) => placeItem(c.place, kfmt(tok(c.res.chars)) + " tok")).join("") || none("Nothing yet")}</ul>
    <p class="h3">Failed most</p><ul class="ranked">${failRows.map(([k, n]) => placeItem(k, n)).join("") || none("Nothing failed")}</ul>
    <p class="h3">Shortcuts past rs3cache: ${cuts.length}</p><ul class="ranked">${cuts.slice(-5).reverse().map((c) => `<li><span class="what"><code>${esc(c.detail)}</code></span><span class="how">${clock(c.t)}</span></li>`).join("") || none("Every cache question went to a tool.")}</ul>`;
}

function renderMapChrome(t) {

S.mode = "map";
const SB = { projects: [], runs: [], active: null, run: null, after: 0, viewing: null, suite: 0, pinned: false,
  sel: null, tab: "check", filter: "all", out: [], src: new Map(), srcDone: 0, keys: {}, nodes: [], shownAt: 0 };

function setMode(mode) {

  $("modeMap").setAttribute("aria-pressed", String(mode === "map"));
  $("modeSand").setAttribute("aria-pressed", String(mode === "sandbox"));
  $("mapOnly").style.display = mode === "map" ? "flex" : "none";
  $("mapSep").style.display = mode === "map" ? "" : "none";
  $("legend").style.visibility = mode === "map" ? "" : "hidden";
  $("routebar").style.visibility = mode === "map" ? "" : "hidden";
  SB.keys = {};
  if (mode === "sandbox") sbPoll();
  else setTimeout(resize, 50);
}
$("modeMap").addEventListener("click", () => setMode("map"));
$("modeSand").addEventListener("click", () => setMode("sandbox"));

let sbTimer = 0;
async function sbPoll() {
  clearTimeout(sbTimer);
  try {
    const got = await (await fetch(`/sandbox?after=${SB.after}${SB.viewing ? "&run=" + SB.viewing : ""}`, { cache: "no-store" })).json();
    SB.projects = got.projects; SB.runs = got.runs; SB.active = got.active;
    if (got.run) {
      if (!SB.run || SB.run.id !== got.run.id) {
        const fresh = SB.after === 0;
        SB.run = { ...got.run, suites: got.run.suites.map((s) => ({ ...s, list: [] })) };
        delete SB.run.events;
        SB.out = []; SB.sel = null; SB.after = 0; SB.pinned = false; SB.suite = 0; SB.keys = {}; SB.nodes = [];
        // a different run: what came back was cut at the old run's position, so ask again from its start
        if (!fresh) { sbTimer = setTimeout(sbPoll, 0); return; }
      }
      sbApply(got.run);
    }
  } catch (e) {}
  sbTimer = setTimeout(sbPoll, S.mode === "sandbox" || SB.active ? 350 : 3000);
}
function sbApply(r) {
  const run = SB.run;
  run.ended = r.ended; run.reason = r.reason;
  r.suites.forEach((s, i) => { const mine = run.suites[i]; if (mine) { const list = mine.list; Object.assign(mine, s); mine.list = list; } });
  for (const e of r.events) {
    SB.after = Math.max(SB.after, e.seq);
    const suite = run.suites[e.i];
    if (e.k === "check" && suite) { e.j = suite.list.length; suite.list.push(e); }
    else if (e.k !== "done") SB.out.push(e);
  }
  if (SB.out.length > 1500) SB.out.splice(0, SB.out.length - 1500);
  if (!SB.pinned) {
    const running = run.suites.findIndex((s) => s.state === "running");
    const failed = run.suites.findIndex((s) => s.failed);
    const pick = running >= 0 ? running : run.ended && failed >= 0 && !SB.keys.followed ? failed : SB.suite;
    if (pick !== SB.suite) { SB.suite = pick; SB.sel = null; }
    if (run.ended) SB.keys.followed = true;
  }
}
function sbPost(body) {
  return fetch("/sandbox/run", { method: "POST", headers: { "X-Pool": "1", "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(() => { SB.viewing = null; SB.keys = {}; setTimeout(sbPoll, 150); });
}

const secsOf = (ms) => (ms == null ? "" : ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(1)}s`);
function agrees(s) { const h = s.harness; return h ? h[0] + h[1] === s.checks && h[1] === s.failed : null; }

function renderSuites(run) {
  const box = $("sbSuites");
  if (SB.nodes.length !== run.suites.length || SB.nodes.run !== run.id) {
    box.innerHTML = "";
    SB.nodes = run.suites.map((s, i) => {
      const b = document.createElement("button");
      b.className = "suite";
      b.dataset.i = i;
      b.innerHTML = `<span class="top"><span class="nm"></span><span class="ct"></span></span><span class="cells"></span>`;
      b._n = 0;
      box.appendChild(b);
      return b;
    });
    SB.nodes.run = run.id;
  }
  run.suites.forEach((s, i) => {
    const b = SB.nodes[i];
    const cls = `suite ${s.state}`;
    if (b.className !== cls) b.className = cls;
    b.setAttribute("aria-current", String(i === SB.suite));
    const ct = s.state === "waiting" ? "waiting" : s.state === "running" ? `${s.list.length} so far`
      : `${s.checks - s.failed} passed${s.failed ? `, <span class="bad">${s.failed} failed</span>` : ""} · ${secsOf(s.ms)}`;
    if (b._ct !== ct) { b._ct = ct; b.querySelector(".ct").innerHTML = ct; b.querySelector(".nm").textContent = s.name; }
    if (b._n < s.list.length) {
      const cells = b.querySelector(".cells"), frag = document.createDocumentFragment(), animate = s.list.length - b._n < 150;
      for (let j = b._n; j < s.list.length; j++) {
        const cell = document.createElement("i");
        cell.className = (s.list[j].ok ? "" : "x ") + (animate ? "new" : "");
        frag.appendChild(cell);
      }
      cells.appendChild(frag);
      b._n = s.list.length;
    }
  });
  const done = run.suites.filter((s) => s.state === "passed" || s.state === "failed").length;
  const note = `${done} of ${run.suites.length} done`;
  if (SB.keys.suitesNote !== note) { SB.keys.suitesNote = note; $("sbSuitesNote").textContent = note; }
  if (!SB.pinned && SB.active === run.id) SB.nodes[SB.suite]?.scrollIntoView({ block: "nearest" });
}

function checkRow(s, e, fresh) {
  const b = document.createElement("button");
  b.className = `ck ${e.ok ? "" : "x"} ${fresh ? "new" : ""}`;
  b.dataset.j = e.j;
  b.setAttribute("aria-current", String(SB.sel === e.j));
  b.innerHTML = `<span class="n">#${e.j + 1}</span><span class="l">line ${e.outer || e.line}</span><span class="lb">${esc(e.label)}</span>
    <span class="v">${e.ok ? esc(e.got) : `got ${esc(e.got)}, want ${esc(e.want)}`}</span><span class="mk">${e.ok ? "✓" : "✕"}</span>`;
  return b;
}
function renderChecks(run) {
  const s = run.suites[SB.suite];
  if (!s) return;
  const fails = s.list.filter((e) => !e.ok).length;
  const a = agrees(s), h = s.harness;
  const head = `<h3>${esc(s.name)}</h3><span>${esc(s.file)}</span>
    <span class="sb-filter"><button data-f="all" aria-pressed="${SB.filter === "all"}">All ${s.list.length}</button><button data-f="failed" aria-pressed="${SB.filter === "failed"}">Failed ${fails}</button></span>
    <span class="agree">${s.state === "waiting" ? "Not run yet." : s.state === "running" ? `Running now, ${s.list.length} checks in.` :
      `${s.checks} checks, ${s.failed} failed, exit ${s.exit}, ${secsOf(s.ms)}.${h ? ` The suite's own count says <b>${h[0]} passed, ${h[1]} failed</b>, ${a ? "which matches." : "which does not match."}` : " It prints no count of its own."}`}</span>`;
  if (SB.keys.head !== head) { SB.keys.head = head; $("sbMainHead").innerHTML = head; }

  const box = $("sbChecks"), key = `${run.id}:${SB.suite}:${SB.filter}`;
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  if (SB.keys.checks !== key) {
    SB.keys.checks = key; box.innerHTML = ""; box._n = 0; box.scrollTop = 0;
  }
  if (!s.list.length) {
    const msg = s.state === "waiting" ? "Waiting for its turn." : s.state === "running" ? "Starting…"
      : s.exit ? `Stopped with exit ${s.exit} before any check. The Output tab has what it printed.` : "A smoke test: it counts no checks, and it ran clean. The Output tab has what it printed.";
    if (box._msg !== msg) { box._msg = msg; box.innerHTML = `<div class="sb-empty">${esc(msg)}</div>`; }
    return;
  }
  if (box._msg) { box._msg = ""; box.innerHTML = ""; box._n = 0; }
  if (box._n < s.list.length) {
    const frag = document.createDocumentFragment(), animate = s.list.length - box._n < 60;
    for (let j = box._n; j < s.list.length; j++) {
      const e = s.list[j];
      if (SB.filter === "failed" && e.ok) continue;
      frag.appendChild(checkRow(s, e, animate));
    }
    box.appendChild(frag);
    box._n = s.list.length;
    if (stick && SB.active === run.id) box.scrollTop = box.scrollHeight;
  }
  box.querySelectorAll('.ck[aria-current="true"]').forEach((el) => { if (Number(el.dataset.j) !== SB.sel) el.setAttribute("aria-current", "false"); });
  if (SB.sel != null) box.querySelector(`.ck[data-j="${SB.sel}"]`)?.setAttribute("aria-current", "true");
}

function sourceOf(run, i, line, from) {
  const key = `${run.id}:${i}:${line}:${from || 0}`;
  if (!SB.src.has(key)) {
    SB.src.set(key, null);
    fetch(`/sandbox/source?run=${run.id}&suite=${i}&line=${line}${from ? "&from=" + from : ""}`).then((r) => (r.ok ? r.json() : false))
      .catch(() => false).then((d) => { SB.src.set(key, d); SB.srcDone++; });
  }
  return SB.src.get(key);
}
const CHECK_LINE = /^\s*(eq|near|has|lacks|expect|isTrue|isFalse|ok|check)\s*\(/;
function srcHTML(src, at, from) {
  if (src === undefined || src === null) return `<div class="src"><div>reading the test…</div></div>`;
  if (!src) return "";
  return `<div class="src">${src.lines.map((l, k) => {
    const n = src.start + k;
    const cls = n === at ? (from ? "from" : "at") : /^\s*--/.test(l) ? "com" : l.trim() && !CHECK_LINE.test(l) && n !== at ? "setup" : "";
    return `<div class="${cls}"><i>${n}</i>${esc(l)}</div>`;
  }).join("")}</div>`;
}

function renderTab(run) {
  const box = $("sbTab");
  let html = "";
  if (SB.tab === "check") {
    const s = run.suites[SB.suite];
    const following = SB.sel == null && s && s.state === "running" && s.list.length;
    const j = SB.sel != null ? SB.sel : following ? s.list.length - 1 : null;
    const e = s && j != null ? s.list[j] : null;
    if (following && performance.now() - SB.shownAt < 600 && SB.keys.tabKind === "follow") return;
    SB.shownAt = performance.now();
    SB.keys.tabKind = following ? "follow" : "";
    if (e) {
      const step = e.outer || e.line, prev = s.list[j - 1], prevStep = prev ? prev.outer || prev.line : 0;
      const from = prevStep && prevStep < step && step - prevStep <= 60 ? prevStep + 1 : Math.max(1, step - 8);
      const setup = sourceOf(run, SB.suite, step, from);
      const inner = e.outer ? sourceOf(run, SB.suite, e.line) : undefined;
      html = `<div class="sb-pane">
        <span class="kind">${following ? "Latest check, following the run · " : ""}${esc(s.name)} · check ${j + 1} of ${s.list.length} · line ${step}</span>
        <p class="sb-label">${esc(e.label)}</p>
        <div><span class="pill ${e.ok ? "ok" : "bad"}">${e.ok ? "passed" : "failed"}</span>${e.disagree ? ` <span class="pill bad">values match, but the suite printed FAIL</span>` : ""}</div>
        <div class="gw"><div><span>What the code gave</span><pre class="${e.ok ? "good" : "bad"}">${esc(e.got)}</pre></div><div><span>What the test wanted</span><pre>${esc(e.want)}</pre></div></div>
        <p class="sb-h">The mock state it was given <small>· what the test ran since its previous check. Lines with a blue edge set things up; the gold line is the check</small></p>
        ${srcHTML(setup, step)}
        ${e.outer ? `<p class="sb-h">Where the comparison happens <small>· inside a helper at line ${e.line}</small></p>${srcHTML(inner, e.line, true)}` : ""}
      </div>`;
    } else {
      const fails = [];
      run.suites.forEach((su, i) => su.list.forEach((c) => { if (!c.ok) fails.push([i, c]); }));
      html = `<div class="sb-pane"><p class="sb-h">Pick any check to see the mock state it was given and what came back.</p>
        <p class="sb-h">${fails.length ? `${fails.length} failed check${fails.length === 1 ? "" : "s"} in this run` : run.ended ? "Every check in this run passed." : "No failures so far."}</p>
        ${fails.map(([i, c]) => `<button class="ck x" data-i="${i}" data-j="${c.j}" style="grid-template-columns:minmax(0,1fr)"><span class="lb"><b>${esc(run.suites[i].name)}</b> · line ${c.outer || c.line}<br>${esc(c.label)}<br><span class="v">got ${esc(c.got)}, want ${esc(c.want)}</span></span></button>`).join("")}</div>`;
    }
  } else if (SB.tab === "output") {
    const lines = SB.out.slice(-400).map((e) => {
      const s = run.suites[e.i] || {};
      if (e.k === "suite") return `<div class="outl suite-start">${esc(s.name)}</div>`;
      if (e.k === "end") return `<div class="outl end">${esc(e.name)}: ${e.checks} checks, ${e.failed} failed, exit ${e.exit}, ${secsOf(e.ms)}</div>`;
      return `<div class="outl ${e.err ? "err" : ""}">${esc(e.text)}</div>`;
    }).join("");
    html = `<div class="sb-pane">${lines || `<p class="sb-h">Nothing printed yet.</p>`}</div>`;
  } else {
    const rows = [];
    for (let i = S.calls.length - 1; i >= 0 && rows.length < 40; i--) {
      const c = S.calls[i], isTest = /\/test\/[\w.-]+\.lua$/.test(c.place) && c.act === "run";
      if (c.res?.tests?.length || isTest) rows.push([c, isTest]);
    }
    html = `<div class="sb-pane">${rows.map(([c, isTest]) => `<div class="crun"><div class="top"><span class="dot" style="background:${colorOf(c.sid)}"></span>${clock(c.t)} · ${esc(nameOf(c.sid))}
        ${isTest ? `<button class="stone" data-place="${esc(c.place)}" style="margin-left:auto" ${SB.active ? "disabled" : ""}>Run it here</button>` : ""}</div>
      <div class="cmd">${esc(c.detail || placeShort(c.place))}</div>
      <div class="nums">${(c.res?.tests || []).map(([n, p, f]) => `<span class="${f ? "bad" : ""}">${esc(n ? n + ": " : "")}${p} passed${f ? `, ${f} failed` : ""}</span>`).join("") || `<span style="background:none;color:var(--dim);padding:0">${c.res ? (c.res.err ? "failed, and printed no counts" : "no counts in what it kept") : "running now"}</span>`}</div></div>`).join("") || `<p class="sb-h">No test runs in the last day.</p>`}</div>`;
  }
  const key = SB.tab + html.length + ":" + html.slice(0, 200) + html.slice(-200);
  if (SB.keys.tab !== key) {
    const top = box.scrollTop;
    SB.keys.tab = key; box.innerHTML = html;
    if (SB.tab === "output") box.scrollTop = box.scrollHeight; else box.scrollTop = top;
  }
}

function renderSandbox() {
  const act = SB.runs.find((r) => r.id === SB.active);
  const badge = act ? `<span class="dotlive ${act.failed ? "bad" : ""}"></span>` : "";
  if ($("sbBadge").dataset.html !== badge) { $("sbBadge").innerHTML = badge; $("sbBadge").dataset.html = badge; }
  if (S.mode !== "sandbox") return;
  const run = SB.run, set = (id, html) => { if (SB.keys[id] !== html) { $(id).innerHTML = html; SB.keys[id] = html; } };

  set("sbProjects", SB.projects.map((p) => `<button class="stone" data-project="${esc(p.name)}" ${SB.active ? "disabled" : ""}>▶ Run ${esc(p.name)}<small>${p.suites} suite${p.suites === 1 ? "" : "s"}</small></button>`).join(""));
  if (document.activeElement !== $("sbRuns"))
    set("sbRuns", `<option value="">Follow the latest run</option>` + SB.runs.map((r) => `<option value="${r.id}" ${SB.viewing === r.id ? "selected" : ""}>Run ${r.id}: ${esc(r.project)} at ${clock(r.started)}, ${r.checks.toLocaleString()} checks, ${r.failed} failed</option>`).join(""));

  if (!run) {
    set("sbStatus", "Every check a suite makes, as it makes it. Run one above, or run a suite from any Claude session and it runs here too.");
    set("sbStats", ""); set("sbMainHead", ""); set("sbChecks", ""); set("sbSuites", "");
    renderTab({ suites: [], ended: 0 });
    return;
  }
  const suites = run.suites, done = suites.filter((s) => s.state === "passed" || s.state === "failed");
  const secs = (((run.ended || nowLive()) - run.started) / 1000).toFixed(1);
  const running = suites.find((s) => s.state === "running");
  set("sbStatus", run.ended
    ? `Finished <b>${esc(run.project)}</b> at ${clock(run.ended)} in ${secs}s, ${esc(run.reason)}.`
    : `Running <b>${esc(run.project)}</b>, suite ${done.length + 1} of ${suites.length}${running ? `: <b>${esc(running.name)}</b>` : ""}, ${esc(run.reason)}.`);

  const checks = suites.reduce((a, s) => a + Math.max(s.checks, s.list.length), 0), failed = suites.reduce((a, s) => a + s.failed, 0);
  const counted = done.filter((s) => s.harness), agree = counted.filter((s) => agrees(s)).length, smoke = done.length - counted.length;
  const failedSuites = suites.filter((s) => s.failed || (s.exit && s.state === "failed")).length;
  set("sbStats", `<div>Checks<b>${checks.toLocaleString()}</b>${done.length} of ${suites.length} suites done</div>
    <div>Passed<b class="good">${(checks - failed).toLocaleString()}</b>${checks ? ((1 - failed / checks) * 100).toFixed(2) : "0.00"}% of checks</div>
    <div>Failed<b class="${failed ? "bad" : ""}">${failed}</b>in ${failedSuites} suite${failedSuites === 1 ? "" : "s"}</div>
    <div>Suites clean<b>${done.filter((s) => s.state === "passed").length} of ${suites.length}</b>no failed check, exit 0</div>
    <div>Time<b>${secs}s</b>${run.ended ? "start to finish" : "so far"}</div>
    <div>Own counts match<b class="${agree === counted.length ? "good" : "bad"}">${agree} of ${counted.length}</b>${smoke ? `${smoke} smoke test${smoke === 1 ? "" : "s"} print none` : "every suite prints its total"}</div>`);

  renderSuites(run);
  renderChecks(run);
  renderTab(run);
}

$("sbProjects").addEventListener("click", (ev) => { const b = ev.target.closest("[data-project]"); if (b && !b.disabled) sbPost({ project: b.dataset.project }); });
$("sbRuns").addEventListener("change", (ev) => { SB.viewing = Number(ev.target.value) || null; SB.run = null; SB.after = 0; SB.keys = {}; sbPoll(); });
$("sbSuites").addEventListener("click", (ev) => {
  const b = ev.target.closest(".suite");
  if (b) { SB.suite = Number(b.dataset.i); SB.pinned = true; SB.sel = null; SB.keys.head = ""; }
});
$("sbMainHead").addEventListener("click", (ev) => { const b = ev.target.closest("[data-f]"); if (b) { SB.filter = b.dataset.f; SB.keys.head = ""; } });
$("sbChecks").addEventListener("click", (ev) => {
  const b = ev.target.closest(".ck[data-j]");
  if (b) { SB.sel = Number(b.dataset.j); SB.pinned = true; SB.tab = "check"; syncSbTabs(); SB.keys.tab = ""; }
});
$("sbTab").addEventListener("click", (ev) => {
  const place = ev.target.closest("[data-place]");
  if (place && !place.disabled) { sbPost({ place: place.dataset.place }); return; }
  const b = ev.target.closest(".ck[data-j]");
  if (b) { SB.suite = Number(b.dataset.i); SB.sel = Number(b.dataset.j); SB.pinned = true; SB.keys.tab = ""; }
});
function syncSbTabs() { document.querySelectorAll("#sbTabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.t === SB.tab))); }
$("sbTabs").addEventListener("click", (ev) => { const b = ev.target.closest("[data-t]"); if (b) { SB.tab = b.dataset.t; syncSbTabs(); SB.keys.tab = ""; } });

let fogAt = 0;
function slowLoop() {
  renderSandbox();
  const t = T(), now = performance.now();
  updateTravellers(t);
  if (S.newPlaces && (now - world.builtAt > 8000 || !world.list.length)) buildWorld();
  if (now - fogAt > 600) { renderFog(t); fogAt = now; }
  renderRoster(t);
  renderChat(t);
  renderSide(t);
  renderMapChrome(t);
  drawTimeline();
  drawClock();
}

function resize() {
  const r = map.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(300, r.width), h = Math.max(220, r.height);
  if (w === MW && h === MH) return;
  const first = !MW;
  if (!first) { V.ox *= w / MW; V.oy *= w / MW; }
  MW = w; MH = h;
  map.width = Math.round(MW * DPR); map.height = Math.round(MH * DPR);
  buildWorld();
  renderFog(T());
}

async function start() {
  try {
    const meta = await (await fetch("/meta", { cache: "no-store" })).json();
    S.tools = meta.tools; S.home = meta.home; S.user = meta.user || "you";
    S.sandbox = !!meta.sandbox;
    $("modeSand").hidden = !S.sandbox;
    ACT.askuser.verb = "asked " + S.user;
  } catch (e) {}
  await poll();
  if (document.fonts?.ready) await document.fonts.ready;
  resize();
  new ResizeObserver(() => { clearTimeout(start.rz); start.rz = setTimeout(resize, 120); }).observe($("mapwrap"));
  setInterval(slowLoop, 250);
  if (S.sandbox) sbPoll();
  slowLoop();
  requestAnimationFrame(frame);
}
start();
</script>
